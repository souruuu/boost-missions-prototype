<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boost Missions – Prototype viewer</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B5BDB;text-decoration:none}a:hover{color:#2F4AC0}
</style>
</helmet>
<div style="width: 1440px; height: 1040px; box-sizing: border-box; background: #EDF0F7; font-family: Inter, system-ui, sans-serif; color: #1B1F3B; font-variant-numeric: tabular-nums; display: grid; grid-template-columns: 400px 1fr; overflow: hidden">

  <aside style="background: #FFFFFF; box-sizing: border-box; padding: 48px 36px 36px; display: flex; flex-direction: column; gap: 28px; box-shadow: 1px 0 0 #E3E6EF">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, #4C6EF5 0%, #3B5BDB 55%, #2F4AC0 100%); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></span>
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; color: #6B7090">CLICKABLE PROTOTYPE</span>
      </div>
      <h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em">Boost Missions</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #4A4F6E">One sales problem becomes a 7-day experiment the owner controls.</p>
    </div>

    <nav aria-label="Journey steps" style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{ steps }}" as="st" hint-placeholder-count="5">
        <button onClick="{{ st.pick }}" aria-current="{{ st.current }}" style="{{ st.rowStyle }}">
          <span style="{{ st.numStyle }}">{{ st.num }}</span>
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #1B1F3B">{{ st.title }}</span>
            <span style="font-size: 13px; line-height: 18px; color: #5A5F7D">{{ st.desc }}</span>
          </span>
        </button>
      </sc-for>
    </nav>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 10px">
        <button onClick="{{ prev }}" aria-label="Previous step" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid #E3E6EF; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
        <button onClick="{{ next }}" style="flex-grow: 1; height: 52px; border-radius: 14px; border: 0; background: linear-gradient(135deg, #4C6EF5 0%, #3B5BDB 55%, #2F4AC0 100%); box-shadow: 0 8px 24px rgba(59,91,219,.28); color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">{{ nextLabel }}<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 17px; color: #5A5F7D">Concept screens with sample data. The 30% fee is an example rate, not Grab policy.</p>
    </div>
  </aside>

  <main style="box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 18px; color: #4A4F6E">
      <span style="background: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-weight: 600; color: #3B5BDB; box-shadow: 0 1px 2px rgba(27,31,59,.06)">Step {{ counter }}</span>
      <span>{{ hint }}</span>
    </div>

    <sc-if value="{{ s1 }}" hint-placeholder-val="{{ true }}">
      <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; background: #F6F7FB; box-shadow: 0 0 0 10px #1B1F3B, 0 30px 80px rgba(27,31,59,.28)">
        <dc-import name="Main" hint-size="390px,844px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}">
      <div style="width: 390px; height: 844px; border-radius: 40px; overflow-y: auto; overflow-x: hidden; background: #F6F7FB; box-shadow: 0 0 0 10px #1B1F3B, 0 30px 80px rgba(27,31,59,.28)">
        <dc-import name="Choose" preset="{{ true }}" hint-size="390px,1120px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}">
      <div style="width: 390px; height: 844px; border-radius: 40px; overflow-y: auto; overflow-x: hidden; background: #F6F7FB; box-shadow: 0 0 0 10px #1B1F3B, 0 30px 80px rgba(27,31,59,.28)">
        <dc-import name="Limits2" hint-size="390px,992px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ s4 }}" hint-placeholder-val="{{ false }}">
      <div style="width: 860px; height: 900px; border-radius: 28px; overflow-y: auto; overflow-x: hidden; box-shadow: 0 30px 80px rgba(27,31,59,.18)">
        <dc-import name="Run" hint-size="860px,960px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ s5 }}" hint-placeholder-val="{{ false }}">
      <div style="width: 390px; height: 844px; border-radius: 40px; overflow-y: auto; overflow-x: hidden; background: #F6F7FB; box-shadow: 0 0 0 10px #1B1F3B, 0 30px 80px rgba(27,31,59,.28)">
        <dc-import name="Result" hint-size="390px,1960px"></dc-import>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  renderVals() {
    var self = this;
    var cur = this.state.step;
    var data = [
      { title: 'Discover', desc: 'A weekly check spots quiet afternoons and suggests one mission.', hint: 'The suggested mission' },
      { title: 'Understand & choose', desc: 'See what you keep per plate, then pick a set over a discount.', hint: 'Scroll inside the phone' },
      { title: 'Set limits & approve', desc: 'The owner sets budget and kitchen limit, and sees the worst case first.', hint: 'Try the budget stepper' },
      { title: 'Run', desc: 'The owner tracks extra orders. Staff get a checklist with no money.', hint: 'Owner view and staff view, day 3' },
      { title: 'Result & next', desc: 'Proof against baseline and similar shops, then rewards and the next mission.', hint: 'Scroll inside the phone' }
    ];
    var steps = data.map(function (d, i) {
      var on = i === cur;
      return {
        num: String(i + 1),
        title: d.title,
        desc: d.desc,
        current: on ? 'step' : 'false',
        pick: function () { self.setState({ step: i }); },
        rowStyle: 'display: flex; gap: 14px; align-items: flex-start; width: 100%; padding: 12px 14px; border-radius: 16px; font-family: inherit; cursor: pointer; text-align: left; border: 1px solid ' + (on ? '#C9D3FA' : 'transparent') + '; background: ' + (on ? '#EDF1FF' : 'transparent'),
        numStyle: 'width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' + (on ? 'background: #3B5BDB; color: #FFFFFF' : (i < cur ? 'background: #E6F7F1; color: #0B7A58' : 'background: #EEF0F6; color: #4A4F6E'))
      };
    });
    return {
      steps: steps,
      s1: cur === 0, s2: cur === 1, s3: cur === 2, s4: cur === 3, s5: cur === 4,
      counter: (cur + 1) + ' of 5',
      hint: data[cur].hint,
      nextLabel: cur === 4 ? 'Start over' : 'Next: ' + data[cur + 1].title,
      prev: function () { self.setState({ step: Math.max(0, self.state.step - 1) }); },
      next: function () { self.setState({ step: self.state.step >= 4 ? 0 : self.state.step + 1 }); }
    };
  }
}
</script>
</body>
</html>
